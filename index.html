<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fffefa"><title>차량 컬렉션</title><link rel="stylesheet" href="style.css?v=2"></head>
<body><header class="header"><h1>차량 컬렉션</h1><button id="rank" class="outline">차량계급도</button></header>
<main><section class="garage" aria-label="차량 컬렉션"><div class="toolbar"><div class="tabs" role="tablist" aria-label="차량 분류"><button id="parking-tab" role="tab" aria-selected="true" aria-controls="viewport" data-mode="parking">주차장 배치</button><button id="brand-tab" role="tab" aria-selected="false" aria-controls="viewport" data-mode="brand">차량 브랜드</button></div><div class="toolbar-actions"><label id="classic-control" class="classic-control" hidden><input id="classic-toggle" type="checkbox" checked>클래식카 분리</label><button id="reset" class="icon-button" aria-label="전체 배치로 돌아가기">↺</button></div></div>
<div id="viewport" class="viewport" tabindex="0" role="region" aria-label="차량 배치. 휠과 버튼으로 확대·축소"><div id="scene"></div></div>
<div class="controls"><div class="navigation"><button id="prev" class="icon-button" aria-label="이전 배치">←</button><span id="position" aria-live="polite"></span><button id="next" class="icon-button" aria-label="다음 배치">→</button></div><div class="zoom"><button id="minus" class="icon-button" aria-label="축소">−</button><div class="zoom-levels" role="group" aria-label="보기 크기"><button data-level="0" aria-pressed="true">3줄</button><button data-level="1" aria-pressed="false">한 줄</button><button data-level="2" aria-pressed="false" id="group-label">한 분류</button><button data-level="3" aria-pressed="false">한 대</button></div><button id="plus" class="icon-button" aria-label="확대">＋</button></div></div></section></main>
<dialog id="rank-dialog" aria-labelledby="rank-title"><div class="dialog-header"><h2 id="rank-title">차량계급도</h2><button id="close-rank" class="icon-button" aria-label="차량계급도 닫기">×</button></div><div class="rank-panels"><section id="rank-list" aria-label="브랜드 계급도"></section><section class="owned-panel" aria-labelledby="owned-title"><h3 id="owned-title">브랜드별 나의 차량 수</h3><div id="owned-list"></div></section></div></dialog>
<script src="data.js?v=2"></script><script src="geometry.js?v=2"></script><script src="app.js?v=2"></script></body></html>
